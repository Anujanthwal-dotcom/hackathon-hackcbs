[project]
name = "cura-health-generator"
version = "0.1.0"
description = "Bedside synthetic telemetry generator for Cura Health"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
]

[tool.setuptools.packages.find]
include = ["app*"]
