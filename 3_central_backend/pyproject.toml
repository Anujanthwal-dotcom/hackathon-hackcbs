[project]
name = "cura-health-central-backend"
version = "0.1.0"
description = "Central real-time hospital hub for Cura Health"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "pydantic>=2.8.0",
    "python-dotenv>=1.0.1",
]

[tool.setuptools.packages.find]
include = ["app*"]
